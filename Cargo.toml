[package]
name = "pokemon_bank_offline"
version = "0.0.1"
edition = "2021"

[dependencies]
libc_alloc = "1.0.6"
num_enum = { version = "0.5", default-features = false }
once_cell = { version = "1.16", default-features = false }
zerocopy = { version = "0.8.56", features = ["derive"] }

[build-dependencies]
cc = "1"

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 1
lto = false
panic = "abort"

[profile.dev]
panic = "abort"
